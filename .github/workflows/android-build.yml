name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-check:
    name: TypeScript and web build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript check and production build
        run: npm run build

      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: kidguard-web-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  android-build:
    name: Android debug and signed release build
    needs: web-check
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Android SDK platform and build tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
          accept-android-sdk-license: true

      - name: Install dependencies and sync Capacitor
        run: |
          npm ci --legacy-peer-deps
          npm run build
          npx cap sync android

      - name: Decode release keystore
        if: ${{ env.KEYSTORE_BASE64 != '' && env.KEY_ALIAS != '' && env.KEY_PASSWORD != '' && env.STORE_PASSWORD != '' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/kidguard-release.jks"
          test -s "$RUNNER_TEMP/signing/kidguard-release.jks"
          chmod 600 "$RUNNER_TEMP/signing/kidguard-release.jks"
          echo "KIDGUARD_KEYSTORE_PATH=$RUNNER_TEMP/signing/kidguard-release.jks" >> "$GITHUB_ENV"

      - name: Verify signing configuration
        id: signing
        run: |
          if [ -n "${KIDGUARD_KEYSTORE_PATH:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            keytool -list -keystore "$KIDGUARD_KEYSTORE_PATH" -alias "$KEY_ALIAS" -storepass "$STORE_PASSWORD" >/dev/null
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are not configured; release artifact will not be built."
          fi

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build signed release APK and AAB
        if: steps.signing.outputs.configured == 'true'
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kidguard-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed release APK
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kidguard-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed release AAB
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kidguard-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload Gradle reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports
          path: |
            android/**/build/reports/
            android/**/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
